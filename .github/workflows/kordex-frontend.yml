name: Kordex frontend

on:
  push:
    branches: ['codex/mcp-overlay-relative-to']
    paths:
      - 'frontend/**'
      - 'docker/kordex/**'
      - '.github/workflows/kordex-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kordex-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'Xelopat/penpot'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build, test and publish the frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="2.18.5-kordex.1-${GITHUB_SHA:0:12}"
          docker buildx build \
            --file docker/kordex/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --build-arg "KORDEX_VERSION=$version" \
            --tag "ghcr.io/xelopat/penpot-frontend:$version" \
            --tag ghcr.io/xelopat/penpot-frontend:2.18.5-kordex.1 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push .
          echo "Image: ghcr.io/xelopat/penpot-frontend:$version" >> "$GITHUB_STEP_SUMMARY"
