name: Kordex MCP

on:
  push:
    branches: ['codex/mcp-overlay-relative-to']
    paths:
      - 'mcp/**'
      - 'docker/images/Dockerfile.mcp.kordex*'
      - '.github/workflows/kordex-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: kordex-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'Xelopat/penpot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build, test and publish MCP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          version="2.18.5-kordex.2-${GITHUB_SHA:0:12}"
          docker buildx build \
            --file docker/images/Dockerfile.mcp.kordex \
            --platform linux/amd64,linux/arm64 \
            --build-arg "KORDEX_MCP_VERSION=$version" \
            --tag "ghcr.io/xelopat/penpot-mcp:$version" \
            --tag ghcr.io/xelopat/penpot-mcp:kordex \
            --tag ghcr.io/xelopat/penpot-mcp:2.18.5-kordex.2 \
            --cache-from type=gha,scope=kordex-mcp \
            --cache-to type=gha,scope=kordex-mcp,mode=max \
            --push .
          echo "Image: ghcr.io/xelopat/penpot-mcp:$version" >> "$GITHUB_STEP_SUMMARY"
